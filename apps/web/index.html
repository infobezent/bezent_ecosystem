<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bezent</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/bezent-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <script>
      // Pre-React theme initialization — prevents a flash of the wrong
      // theme (FOUC). Must stay in sync with app/providers/ThemeProvider's
      // storage key and resolution logic; see
      // docs/architecture/DESIGN-SYSTEM.md#theme-foundation. Kept minimal,
      // dependency-free, and synchronous so it runs before first paint.
      (function () {
        try {
          var STORAGE_KEY = 'bezent-theme';
          var stored = localStorage.getItem(STORAGE_KEY);
          var mode = stored === 'dark' || stored === 'system' ? stored : 'light';
          var theme =
            mode === 'system'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <style>
      #bezent-initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #ffffff;
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: #0f172a;
        z-index: 99999;
      }
      [data-theme='dark'] #bezent-initial-loader {
        background: #090d16;
        color: #f8fafc;
      }
      .bezent-init-logo-wrap {
        position: relative;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .bezent-init-glow {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(26, 115, 232, 0.22) 0%, rgba(26, 115, 232, 0) 70%);
        animation: bezentInitGlow 2s ease-in-out infinite;
      }
      @keyframes bezentInitGlow {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.5;
        }
        50% {
          transform: scale(1.35);
          opacity: 0.9;
        }
      }
      .bezent-init-wordmark {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .bezent-init-wordmark span {
        color: #1a73e8;
      }
      [data-theme='dark'] .bezent-init-wordmark span {
        color: #38bdf8;
      }
      .bezent-init-track {
        width: 180px;
        height: 4px;
        background: #e2e8f0;
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      [data-theme='dark'] .bezent-init-track {
        background: #1e293b;
      }
      .bezent-init-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        border-radius: 999px;
        background: linear-gradient(90deg, #1a73e8 0%, #38bdf8 100%);
        animation: bezentInitIndeterminate 1.4s infinite cubic-bezier(0.65, 0, 0.35, 1);
      }
      [data-theme='dark'] .bezent-init-bar {
        background: linear-gradient(90deg, #38bdf8 0%, #818cf8 100%);
      }
      @keyframes bezentInitIndeterminate {
        0% {
          left: -45%;
          width: 35%;
        }
        50% {
          left: 35%;
          width: 65%;
        }
        100% {
          left: 100%;
          width: 35%;
        }
      }
      .bezent-init-label {
        font-size: 13px;
        font-weight: 500;
        color: #64748b;
      }
      [data-theme='dark'] .bezent-init-label {
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="bezent-initial-loader" aria-busy="true" aria-label="Loading BEZENT Workspace">
        <div class="bezent-init-logo-wrap">
          <div class="bezent-init-glow"></div>
          <img
            src="/bezent-mark.png"
            width="52"
            height="52"
            alt="BEZENT"
            style="border-radius: 50%; display: block"
          />
        </div>
        <div class="bezent-init-wordmark">bezent<span>.</span></div>
        <div class="bezent-init-track"><div class="bezent-init-bar"></div></div>
        <div class="bezent-init-label">Initializing BEZENT Workspace…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
