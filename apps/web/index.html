<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BEZENT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <script>
      // Pre-React theme initialization — prevents a flash of the wrong
      // theme (FOUC). Must stay in sync with app/providers/ThemeProvider's
      // storage key and resolution logic; see
      // docs/architecture/DESIGN-SYSTEM.md#theme-foundation. Kept minimal,
      // dependency-free, and synchronous so it runs before first paint.
      (function () {
        try {
          var STORAGE_KEY = 'bezent-theme';
          var stored = localStorage.getItem(STORAGE_KEY);
          var mode = stored === 'dark' || stored === 'system' ? stored : 'light';
          var theme =
            mode === 'system'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
