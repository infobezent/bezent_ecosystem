<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Afternoon Sky Gradient -->
    <linearGradient id="aft-sky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff8f0" stop-opacity="1" />
      <stop offset="35%" stop-color="#fff1e0" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#fee2b8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.85" />
    </linearGradient>

    <!-- Warm Golden Sun Glow -->
    <radialGradient id="aft-sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>

    <!-- Sun Disc -->
    <radialGradient id="aft-sun-core" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </radialGradient>

    <!-- Soft Mountains Shadow -->
    <linearGradient id="aft-mountain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fdba74" stop-opacity="0.1" />
    </linearGradient>

    <!-- Skyline Silhouette Gradients -->
    <linearGradient id="aft-skyline-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="aft-skyline-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="1200" height="240" fill="url(#aft-sky)" />

  <!-- Distant Mountain Ridges -->
  <path d="M480 240 Q620 130 760 170 T1050 140 L1200 160 L1200 240 Z" fill="url(#aft-mountain)" />

  <!-- Giant Golden Sun Corona and Disc (Afternoon) -->
  <circle cx="680" cy="180" r="140" fill="url(#aft-sun-glow)" />
  <circle cx="680" cy="180" r="52" fill="url(#aft-sun-core)" />

  <!-- Distant Background City Skyline Silhouette -->
  <path d="M520 240 L520 185 L535 185 L535 175 L555 175 L555 190 L570 190 L570 165 L585 165 L585 155 L600 155 L600 190 L620 190 L620 140 L630 140 L630 130 L635 110 L640 130 L640 190 L660 190 L660 170 L680 170 L680 240 Z" fill="url(#aft-skyline-back)" />
  <path d="M720 240 L720 175 L740 175 L740 150 L755 150 L755 160 L775 160 L775 135 L785 125 L795 135 L795 180 L820 180 L820 155 L840 155 L840 190 L870 190 L870 160 L890 160 L890 240 Z" fill="url(#aft-skyline-back)" />

  <!-- Midground City Skyline (Empire-style spire & Modern high-rises) -->
  <path d="M640 240 L640 180 L655 180 L655 165 L675 165 L675 190 L695 190 L695 175 L710 175 L710 160 L720 150 L720 130 L723 90 L726 130 L726 150 L735 160 L735 195 L760 195 L760 170 L780 170 L780 240 Z" fill="url(#aft-skyline-mid)" />
  <path d="M840 240 L840 175 L860 175 L860 145 L885 145 L885 165 L910 165 L910 135 L925 135 L925 120 L935 120 L935 180 L960 180 L960 155 L985 155 L985 195 L1020 195 L1020 240 Z" fill="url(#aft-skyline-mid)" />

  <!-- Architectural Floor-to-Ceiling Office Window Mullions -->
  <line x1="810" y1="0" x2="810" y2="240" stroke="#ffffff" stroke-width="8" stroke-opacity="0.45" />
  <line x1="810" y1="0" x2="810" y2="240" stroke="#cbd5e1" stroke-width="1.5" stroke-opacity="0.6" />

  <line x1="1080" y1="0" x2="1080" y2="240" stroke="#ffffff" stroke-width="8" stroke-opacity="0.4" />
  <line x1="1080" y1="0" x2="1080" y2="240" stroke="#cbd5e1" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Indoor Office Plants / Foliage Framing Right Edge (Lush Monstera & Leaves) -->
  <g id="office-plants" transform="translate(1010, 50)">
    <!-- Back darker leaves -->
    <path d="M120 190 C125 130 90 90 60 70 C50 95 65 140 115 190 Z" fill="#14532d" fill-opacity="0.45" />
    <path d="M160 190 C170 120 140 75 105 50 C95 80 115 135 155 190 Z" fill="#166534" fill-opacity="0.55" />
    <path d="M190 190 C200 110 170 60 130 35 C120 70 145 130 185 190 Z" fill="#14532d" fill-opacity="0.5" />

    <!-- Midground lush tropical leaves with realistic curves -->
    <path d="M85 190 C95 135 60 95 20 80 C15 110 35 150 80 190 Z" fill="#15803d" fill-opacity="0.75" />
    <path d="M110 190 C130 115 85 65 40 45 C30 80 60 135 105 190 Z" fill="#16a34a" fill-opacity="0.85" />
    <path d="M140 190 C165 105 115 50 65 25 C55 65 90 130 135 190 Z" fill="#22c55e" fill-opacity="0.8" />
    <path d="M165 190 C190 115 145 60 95 30 C85 70 120 135 160 190 Z" fill="#16a34a" fill-opacity="0.7" />

    <!-- Foreground bright leaves highlight -->
    <path d="M60 190 C70 145 40 115 5 105 C0 130 20 160 55 190 Z" fill="#4ade80" fill-opacity="0.9" />
    <path d="M85 190 C105 130 70 85 25 70 C20 100 45 150 80 190 Z" fill="#86efac" fill-opacity="0.95" />
    <path d="M115 190 C135 120 95 75 50 55 C42 88 72 145 110 190 Z" fill="#4ade80" fill-opacity="0.85" />

    <!-- Delicate leaf vein strokes -->
    <path d="M85 190 Q65 130 25 70" stroke="#bbf7d0" stroke-width="1.5" fill="none" stroke-opacity="0.8" />
    <path d="M115 190 Q95 120 50 55" stroke="#bbf7d0" stroke-width="1.5" fill="none" stroke-opacity="0.8" />
    <path d="M140 190 Q115 105 65 25" stroke="#86efac" stroke-width="1.5" fill="none" stroke-opacity="0.7" />
  </g>
</svg>
