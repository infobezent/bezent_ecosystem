<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Midnight Sky Gradient -->
    <linearGradient id="nit-sky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="1" />
      <stop offset="35%" stop-color="#1e1b4b" stop-opacity="0.98" />
      <stop offset="70%" stop-color="#2e1065" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9" />
    </linearGradient>

    <!-- Moon Halo -->
    <radialGradient id="nit-moon-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#e0e7ff" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#818cf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0" />
    </radialGradient>

    <!-- Night Skyline Gradients -->
    <linearGradient id="nit-skyline-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="nit-skyline-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <rect width="1200" height="240" fill="url(#nit-sky)" />

  <!-- Stars (twinkles) -->
  <g fill="#ffffff" fill-opacity="0.75">
    <circle cx="510" cy="50" r="1.5" />
    <circle cx="560" cy="80" r="1" />
    <circle cx="620" cy="40" r="2" />
    <circle cx="740" cy="60" r="1.5" />
    <circle cx="790" cy="35" r="1" />
    <circle cx="850" cy="70" r="2" />
    <circle cx="920" cy="45" r="1.5" />
    <circle cx="980" cy="85" r="1" />
    <circle cx="1060" cy="40" r="2" />
    <circle cx="1140" cy="75" r="1.5" />
  </g>

  <!-- Crescent Moon with Halo -->
  <circle cx="680" cy="120" r="70" fill="url(#nit-moon-halo)" />
  <path d="M695 95 A32 32 0 1 0 710 145 A25 25 0 1 1 695 95 Z" fill="#fef08a" />

  <!-- Night Skyline -->
  <path d="M520 240 L520 185 L535 185 L535 175 L555 175 L555 190 L570 190 L570 165 L585 165 L585 155 L600 155 L600 190 L620 190 L620 140 L630 140 L630 130 L635 110 L640 130 L640 190 L660 190 L660 170 L680 170 L680 240 Z" fill="url(#nit-skyline-back)" />
  <path d="M720 240 L720 175 L740 175 L740 150 L755 150 L755 160 L775 160 L775 135 L785 125 L795 135 L795 180 L820 180 L820 155 L840 155 L840 190 L870 190 L870 160 L890 160 L890 240 Z" fill="url(#nit-skyline-back)" />
  <path d="M640 240 L640 180 L655 180 L655 165 L675 165 L675 190 L695 190 L695 175 L710 175 L710 160 L720 150 L720 130 L723 90 L726 130 L726 150 L735 160 L735 195 L760 195 L760 170 L780 170 L780 240 Z" fill="url(#nit-skyline-mid)" />
  <path d="M840 240 L840 175 L860 175 L860 145 L885 145 L885 165 L910 165 L910 135 L925 135 L925 120 L935 120 L935 180 L960 180 L960 155 L985 155 L985 195 L1020 195 L1020 240 Z" fill="url(#nit-skyline-mid)" />

  <!-- Tiny Glowing Office Windows in the Night Skyline -->
  <g fill="#fde047" fill-opacity="0.8">
    <rect x="525" y="195" width="2" height="3" />
    <rect x="540" y="180" width="2" height="3" />
    <rect x="575" y="172" width="2" height="3" />
    <rect x="625" y="160" width="2" height="3" />
    <rect x="650" y="185" width="2" height="3" />
    <rect x="665" y="175" width="2" height="3" />
    <rect x="730" y="180" width="2" height="3" />
    <rect x="745" y="160" width="2" height="3" />
    <rect x="780" y="170" width="2" height="3" />
    <rect x="850" y="180" width="2" height="3" />
    <rect x="870" y="165" width="2" height="3" />
    <rect x="915" y="150" width="2" height="3" />
    <rect x="945" y="170" width="2" height="3" />
  </g>

  <!-- Window Mullions -->
  <line x1="810" y1="0" x2="810" y2="240" stroke="#334155" stroke-width="8" stroke-opacity="0.7" />
  <line x1="810" y1="0" x2="810" y2="240" stroke="#475569" stroke-width="1.5" stroke-opacity="0.8" />
  <line x1="1080" y1="0" x2="1080" y2="240" stroke="#334155" stroke-width="8" stroke-opacity="0.6" />
  <line x1="1080" y1="0" x2="1080" y2="240" stroke="#475569" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- Night Foliage (Deep teal-navy silhouettes) -->
  <g id="office-plants-night" transform="translate(1010, 50)">
    <path d="M120 190 C125 130 90 90 60 70 C50 95 65 140 115 190 Z" fill="#022c22" fill-opacity="0.6" />
    <path d="M160 190 C170 120 140 75 105 50 C95 80 115 135 155 190 Z" fill="#064e3b" fill-opacity="0.7" />
    <path d="M85 190 C95 135 60 95 20 80 C15 110 35 150 80 190 Z" fill="#022c22" fill-opacity="0.85" />
    <path d="M110 190 C130 115 85 65 40 45 C30 80 60 135 105 190 Z" fill="#047857" fill-opacity="0.75" />
    <path d="M140 190 C165 105 115 50 65 25 C55 65 90 130 135 190 Z" fill="#0f766e" fill-opacity="0.8" />
    <path d="M60 190 C70 145 40 115 5 105 C0 130 20 160 55 190 Z" fill="#14b8a6" fill-opacity="0.7" />
    <path d="M85 190 C105 130 70 85 25 70 C20 100 45 150 80 190 Z" fill="#2dd4bf" fill-opacity="0.75" />
  </g>
</svg>
